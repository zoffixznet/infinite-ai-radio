name: Release

on:
  push:
    tags: ["v*"]
  # So a release can be re-run for a tag that already exists, without
  # deleting and re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test before shipping
        run: go test ./...

      - name: Smoke test the built binary
        run: |
          make build
          ./scripts/smoke_test.sh

      - name: Build release tarballs
        run: make release VERSION="${TAG}"
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS
