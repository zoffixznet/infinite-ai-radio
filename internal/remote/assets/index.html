<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bgm remote</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161c26;
    --edge: #2a3547;
    --text: #f0f4f8;
    --dim: #9fb0c3;
    --accent: #35d07f;
    --accent-press: #2aa865;
    --danger: #ff6b6b;
    --focus: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 12px;
  }
  header h1 { font-size: 26px; letter-spacing: 1px; }
  header .sub { color: var(--dim); font-size: 13px; }
  #play {
    width: 100%;
    padding: 18px;
    font-size: 20px; font-weight: 700;
    color: #06130c;
    background: var(--accent);
    border: 0; border-radius: 14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #play:active { background: var(--accent-press); }
  #play.playing { background: var(--danger); color: #1a0707; }
  .card {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 14px;
    padding: 14px;
    margin-top: 14px;
  }
  .card h2 {
    font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--dim);
    margin-bottom: 8px;
  }
  #now { font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  #meta { color: var(--dim); font-size: 14px; margin-top: 6px; }
  #phase { color: var(--focus); font-size: 14px; margin-top: 6px; min-height: 1.2em; }
  textarea {
    width: 100%;
    min-height: 64px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--edge);
    border-radius: 10px;
    padding: 12px;
    font: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--focus); border-color: var(--focus); }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row button { flex: 1; }
  button.action {
    padding: 15px 12px;
    font-size: 16px; font-weight: 600;
    border: 2px solid #46618f;
    border-radius: 12px;
    background: #223050;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.action:active { background: #2c3a5c; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06130c; }
  button.primary:active { background: var(--accent-press); }
  #save { width: 100%; margin-top: 0; }
  #ack {
    margin-top: 10px;
    color: var(--accent);
    font-size: 14px;
    min-height: 1.3em;
    overflow-wrap: anywhere;
  }
  footer { color: var(--dim); font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>bgm</h1>
  <span class="sub" id="conn">remote</span>
</header>

<button id="play" aria-label="Play the live stream">&#9654;&#xFE0E; Play the stream</button>

<section class="card" aria-label="Now playing">
  <h2>Now playing</h2>
  <div id="now">&hellip;</div>
  <div id="meta"></div>
  <div id="phase"></div>
</section>

<section class="card" aria-label="Steering">
  <h2>Steer the music</h2>
  <textarea id="text" placeholder="e.g. calmer &middot; more energetic &middot; add vocals about winning"></textarea>
  <div class="row">
    <button class="action primary" id="steer">Steer</button>
    <button class="action" id="fresh">Start fresh</button>
  </div>
</section>

<section class="card" aria-label="Save">
  <h2>Keep this track</h2>
  <button class="action primary" id="save">&#9825;&#xFE0E; Save this track</button>
  <div id="ack"></div>
</section>

<footer>stream runs a few seconds behind the speakers</footer>

<script>
(function () {
  "use strict";
  var token = new URLSearchParams(location.search).get("token") || "";
  function url(path, extra) {
    var q = [];
    if (token) q.push("token=" + encodeURIComponent(token));
    if (extra) q.push(extra);
    return path + (q.length ? "?" + q.join("&") : "");
  }
  var audio = null;
  var playBtn = document.getElementById("play");
  var ackEl = document.getElementById("ack");

  playBtn.addEventListener("click", function () {
    if (audio) {
      audio.pause();
      audio.src = "";
      audio = null;
      playBtn.classList.remove("playing");
      playBtn.innerHTML = "&#9654;&#xFE0E; Play the stream";
      return;
    }
    audio = new Audio(url("/stream.mp3", "t=" + Date.now()));
    audio.play().catch(function (e) { ack("could not start audio: " + e.message); });
    playBtn.classList.add("playing");
    playBtn.innerHTML = "&#9632;&#xFE0E; Stop listening";
  });

  function ack(text) {
    ackEl.textContent = text;
  }

  function post(path, body, done) {
    fetch(url(path), {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "X-BGM-Remote": "1"
      },
      body: body
    }).then(function (r) { return r.json(); })
      .then(function (d) { ack(d.ack || "done"); if (done) done(d); })
      .catch(function (e) { ack("failed: " + e.message); });
  }

  document.getElementById("steer").addEventListener("click", function () {
    var t = document.getElementById("text").value.trim();
    if (!t) { ack("type what you want first"); return; }
    post("/steer", "text=" + encodeURIComponent(t));
    document.getElementById("text").value = "";
  });
  document.getElementById("fresh").addEventListener("click", function () {
    var t = document.getElementById("text").value.trim();
    if (!t) { ack("type a prompt first, then Start fresh"); return; }
    post("/new", "prompt=" + encodeURIComponent(t));
    document.getElementById("text").value = "";
  });
  document.getElementById("save").addEventListener("click", function () {
    post("/save", "");
  });

  function poll() {
    fetch(url("/state")).then(function (r) { return r.json(); }).then(function (s) {
      document.getElementById("conn").textContent = "connected";
      document.getElementById("now").textContent = s.source || s.state || "...";
      var meta = s.session ? "session " + s.session : "";
      if (s.elapsed) meta += (meta ? "  ·  " : "") + s.elapsed + " / " + s.duration;
      meta += (meta ? "  ·  " : "") + s.queued + " ready" + (s.generating ? " · generating" : "");
      document.getElementById("meta").textContent = meta;
      document.getElementById("phase").textContent =
        s.phase ? s.phase + " (" + s.phase_info + ")" : (s.paused ? "paused at the machine" : "");
    }).catch(function () {
      document.getElementById("conn").textContent = "disconnected";
    });
  }
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
